# Builds the React app and publishes it to GitHub Pages.
#
# Runs on a push that touches the frontend -- which includes the briefings the
# scheduled start/sit routines commit, so a new briefing reaches the deployed
# site without anyone doing anything.
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run so this does not need a manual
          # settings flip. Silently no-ops if Pages is already enabled.
          enablement: true

      - run: npm ci
        working-directory: frontend

      - name: Build
        working-directory: frontend
        # base_path comes back from configure-pages already carrying the repo
        # subpath, so this stays correct if the repo is ever renamed.
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Fail if the fixtures did not ship
        working-directory: frontend
        # The app is static JSON on a CDN -- if public/mock/ is missing from the
        # bundle the site still loads, renders an empty shell, and looks merely
        # "quiet" rather than broken. Catch that here instead of in the browser.
        run: |
          test -f dist/index.html
          test -f dist/mock/league-2/briefings/index.json
          echo "fixtures present: $(find dist/mock -name '*.json' | wc -l) json files"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
