# Builds the React app and checks the fixtures shipped with it.
#
# Deployment itself is Vercel's job, not this workflow's: the Vercel project is
# connected to this repo's git remote and deploys every push to main from the
# `frontend/` root directory. That covers the briefings the scheduled start/sit
# routines commit -- a new briefing reaches the deployed site without anyone
# doing anything, same as before.
#
# This used to publish to GitHub Pages. It never once succeeded: Pages was never
# enabled on the repo, and `actions/configure-pages` cannot create the site
# itself ("Create Pages site failed. Error: Resource not accessible by
# integration"), so every run since 2026-09-05 failed at that step. Rather than
# maintain a second deploy target that needs its own subpath `base` (see
# vite.config.js) and a manual repo-settings flip, the workflow keeps the part
# that was earning its place -- catching a broken build or missing fixtures
# before Vercel ships them -- and leaves deployment to Vercel.
name: Frontend build check

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # No VITE_BASE: Vercel serves from the root, so vite.config.js's '/'
      # fallback is the value that actually ships. Building with the same base
      # Vercel uses is the point -- a subpath build here would check a bundle
      # nobody deploys.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Fail if the fixtures did not ship
        working-directory: frontend
        # The app is static JSON on a CDN -- if public/mock/ is missing from the
        # bundle the site still loads, renders an empty shell, and looks merely
        # "quiet" rather than broken. Catch that here instead of in the browser.
        run: |
          test -f dist/index.html
          test -f dist/mock/league-1/manifest.json
          test -f dist/mock/league-1/weekly-report-week-1.json
          test -f dist/mock/league-2/manifest.json
          # league-2 only: the scheduled start/sit routines write briefings for
          # that league, and league-1 has no briefings/ directory at all.
          test -f dist/mock/league-2/briefings/index.json
          echo "fixtures present: $(find dist/mock -name '*.json' | wc -l) json files"
